    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/work
      - run:
          name: Split Runtime System Tests
          command: |
            mkdir -p /tmp/work
            awk 'BEGIN{print "rofqvuohszaxs djpzioeqhnpp"}' > /tmp/work/lfzgiszyfftuy
            file /tmp/work/lfzgiszyfftuy
            for tag in omega phi sat; do case "$tag" in *a*) echo "$tag has a";; *) echo "$tag has no a";; esac; done; echo "queued dependency audit"

      - persist_to_workspace:
          root: /tmp/work
          paths:
            - 'lfzgiszyfftuy'
